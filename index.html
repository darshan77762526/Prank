<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Offer...</title>
    <style>
        /* Clean, modern, minimalist layout */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        /* The main secure card */
        .card { 
            background: white; 
            max-width: 400px; 
            width: 90%; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            overflow: hidden; 
            min-height: 280px; /* Keeps the card size stable */
            display: flex;
            flex-direction: column;
        }
        
        /* Secure Header */
        .header { 
            background: #fff; 
            padding: 18px; 
            border-bottom: 1px solid #eaeaea; 
            text-align: center; 
            font-weight: 600; 
            font-size: 16px; 
            color: #111; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Centered Loading State */
        .content { 
            padding: 40px 24px; 
            text-align: center; 
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner { 
            width: 36px; 
            height: 36px; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #2874f0; /* Professional Blue */
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 24px; 
        }
        .status { font-size: 15px; color: #444; font-weight: 500; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Prank State */
        #prank-content { display: none; padding: 40px 24px; text-align: center; }
        .prank-icon { font-size: 56px; margin-bottom: 16px; }
        .prank-title { color: #d32f2f; font-size: 26px; font-weight: 900; margin-bottom: 12px; line-height: 1.2; }
        .prank-text { color: #444; font-size: 16px; line-height: 1.6; }
        .highlight { background: #ffeb3b; padding: 2px 6px; font-weight: bold; border-radius: 4px; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Padlock Icon for Security feel -->
        <div class="header" id="app-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Processing Offer Link
        </div>
        
        <div class="content" id="loading-state">
            <div class="spinner"></div>
            <div class="status" id="status-text">Initializing secure connection...</div>
        </div>

        <div id="prank-content">
            <div class="prank-icon">🤡</div>
            <div class="prank-title">PADHAI KAR LE BHAI!</div>
            <div class="prank-text">
                Bada aaya ₹1 ka offer lootne wala.<br><br>
                Ye timepass band kar aur chup-chaap jaa ke apni <span class="highlight">Black Book</span> solve kar! 📚⏳
            </div>
        </div>
    </div>

    <script>
        // Professional step-by-step text updating to build suspense
        const statuses = [
            "Initializing secure connection...",
            "Verifying user account eligibility...",
            "Checking real-time warehouse stock...",
            "Reserving 1₹ item in your slot...",
            "Generating secure checkout link..."
        ];
        
        let step = 0;
        const statusEl = document.getElementById('status-text');
        
        const interval = setInterval(() => {
            step++;
            if(step < statuses.length) {
                statusEl.innerText = statuses[step];
            } else {
                clearInterval(interval);
                
                // Switch out the UI for the prank reveal
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('prank-content').style.display = 'block';
                
                // Change header to warning colors
                const header = document.getElementById('app-header');
                header.innerHTML = '⚠️ Reality Check';
                header.style.backgroundColor = '#ffebee';
                header.style.color = '#d32f2f';
                header.style.borderBottom = 'none';
            }
        }, 1800); // Cycles through the text every 1.8 seconds for a realistic loading feel
    </script>

</body>
</html>
