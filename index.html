<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim ₹1 Loot Offer</title>
    <style>
        /* Clean, modern, constrained layout */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #f0f2f5; /* Standard subtle gray background */
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        /* The main checkout card */
        .card { 
            background: white; 
            max-width: 400px; /* Keeps it looking like a mobile app even on desktop */
            width: 90%; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            overflow: hidden; 
        }
        
        /* Header */
        .header { 
            background: #fff; 
            padding: 18px; 
            border-bottom: 1px solid #eaeaea; 
            text-align: center; 
            font-weight: 600; 
            font-size: 18px; 
            color: #111; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Product Box */
        .content { padding: 24px; text-align: center; }
        .product-skeleton { 
            background: #fdfdfd; 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid #eee; 
        }
        .brand { 
            color: #888; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 6px; 
            font-weight: 600;
        }
        .title { 
            font-size: 16px; 
            color: #222; 
            font-weight: 500; 
            margin-bottom: 12px; 
            line-height: 1.4; 
        }
        .price-row { 
            display: flex; 
            justify-content: center; 
            align-items: baseline; 
            gap: 8px; 
            margin-bottom: 16px; 
        }
        .price { font-size: 32px; font-weight: 800; color: #00a046; } /* Flipkart/Amazon Green */
        .mrp { text-decoration: line-through; color: #777; font-size: 15px; }
        .tag { 
            background: #ffebee; 
            color: #d32f2f; 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: bold; 
        }

        /* Loader */
        .loader-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 24px; 
        }
        .spinner { 
            width: 28px; 
            height: 28px; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #2874f0; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 14px; 
        }
        .status { font-size: 14px; color: #555; font-weight: 500; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Prank State */
        #prank-content { display: none; padding: 40px 24px; text-align: center; }
        .prank-icon { font-size: 56px; margin-bottom: 16px; }
        .prank-title { color: #d32f2f; font-size: 26px; font-weight: 900; margin-bottom: 12px; line-height: 1.2; }
        .prank-text { color: #444; font-size: 16px; line-height: 1.6; }
        .highlight { background: #ffeb3b; padding: 2px 6px; font-weight: bold; border-radius: 4px; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header" id="app-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Secure Checkout
        </div>
        
        <div class="content" id="loading-state">
            <div class="product-skeleton">
                <div class="brand">Myntra Exclusive Deals</div>
                <div class="title">Men Solid Oversized Pure Cotton T-Shirt (Pack of 2)</div>
                <div class="price-row">
                    <span class="price">₹1</span>
                    <span class="mrp">₹1,999</span>
                </div>
                <span class="tag">⚡ 99% OFF - Flash Deal</span>
            </div>
            
            <div class="loader-container">
                <div class="spinner"></div>
                <div class="status" id="status-text">Checking offer validity...</div>
            </div>
        </div>

        <div id="prank-content">
            <div class="prank-icon">🤡</div>
            <div class="prank-title">PADHAI KAR LE BHAI!</div>
            <div class="prank-text">
                Bada aaya ₹1 ka offer lootne wala.<br><br>
                Ye timepass band kar aur chup-chaap jaa ke apni <span class="highlight">Black Book</span> solve kar! 📚⏳
            </div>
        </div>
    </div>

    <script>
        // Professional step-by-step text updating to build suspense
        const statuses = [
            "Checking offer validity...",
            "Reserving items in cart...",
            "Applying special coupon code...",
            "Bypassing payment gateway...",
            "Finalizing your order..."
        ];
        
        let step = 0;
        const statusEl = document.getElementById('status-text');
        
        const interval = setInterval(() => {
            step++;
            if(step < statuses.length) {
                statusEl.innerText = statuses[step];
            } else {
                clearInterval(interval);
                
                // Switch out the UI for the prank reveal
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('prank-content').style.display = 'block';
                
                // Change header to warning colors
                const header = document.getElementById('app-header');
                header.innerHTML = '⚠️ Reality Check';
                header.style.backgroundColor = '#ffebee';
                header.style.color = '#d32f2f';
                header.style.borderBottom = 'none';
            }
        }, 1500); // Cycles through the text every 1.5 seconds
    </script>

</body>
</html>
